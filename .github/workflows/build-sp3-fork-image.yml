name: Build SP3 openEuler validate image (fork)

# Throwaway helper: builds the openEuler 24.03-SP3 validate image (both arches)
# and publishes it to this fork's registry, so PR CI can pull an SP3 image until
# the openhpc org image is rebuilt for SP3. Not for upstream.

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        arch: [ x86_64, aarch64 ]
        include:
          - arch: x86_64
            runs-on: ubuntu-24.04
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
    outputs:
      digest-x86_64: ${{ steps.export.outputs.digest-x86_64 }}
      digest-aarch64: ${{ steps.export.outputs.digest-aarch64 }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./tests/ci/Containerfile.ohpc-validate-openeuler
          platforms: linux/${{ matrix.arch }}
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/ohpc-validate-openeuler,push-by-digest=true,name-canonical=true,push=true
      - id: export
        run: echo "digest-${{ matrix.arch }}=${{ steps.build.outputs.digest }}" >> $GITHUB_OUTPUT

  publish:
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker buildx imagetools create \
            --tag ${{ env.REGISTRY }}/${{ github.repository_owner }}/ohpc-validate-openeuler:sp3 \
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/ohpc-validate-openeuler@${{ needs.build.outputs.digest-x86_64 }} \
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/ohpc-validate-openeuler@${{ needs.build.outputs.digest-aarch64 }}
